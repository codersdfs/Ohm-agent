name: release

# Tag-driven release pipeline for the omega CLI.
# Trigger: push a tag matching v*.*.* (e.g. v0.1.0).
# Outputs: per-OS binary tarball/zip, SHA256SUMS, SBOM, signed checksums,
# and a GitHub Release with auto-generated changelog notes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without publishing a Release"
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # cosign keyless signing (OIDC)

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: omega
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: omega
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: omega
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # Windows 10+ ships bsdtar; no extra install needed. .zip would
            # require the Info-ZIP `zip` binary which is not in the default PATH.
            archive: tar.gz
            binary: omega.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff needs full history for changelog

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/crates/omega-cli/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: build release binary
        working-directory: src-tauri/crates/omega-cli
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: strip Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: strip "target/${{ matrix.target }}/release/omega"

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p staging
          # Workspace root owns the target/ dir (Cargo.toml at repo root,
          # members under src-tauri/crates/*). All build outputs land under
          # target/<triple>/release/ at the repo root.
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          cp LICENSE staging/LICENSE.txt
          cp README.md staging/README.md
          cd staging
          case "${{ matrix.archive }}" in
            tar.gz) tar czf "../omega-${{ matrix.target }}.tar.gz" * ;;
            zip)   zip -r "../omega-${{ matrix.target }}.zip" * ;;
          esac
          cd ..
          # Use Python for SHA-256 since it's available on every GitHub runner
          # (linux, macos, windows) with a stable interface. Avoids the Windows
          # coreutils gap and stays a single shell expression.
          python -c "import hashlib, sys; h = hashlib.sha256(open('omega-${{ matrix.target }}.${{ matrix.archive }}', 'rb').read()).hexdigest(); print(f'{h}  omega-${{ matrix.target }}.${{ matrix.archive }}')" > "omega-${{ matrix.target }}.${{ matrix.archive }}.sha256"

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign artifact (keyless)
        # shell: bash so the line continuations work on Windows
        # (default on windows-latest is pwsh, which doesn't accept `\`).
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature "omega-${{ matrix.target }}.${{ matrix.archive }}.sig" \
            --output-certificate "omega-${{ matrix.target }}.${{ matrix.archive }}.cert" \
            "omega-${{ matrix.target }}.${{ matrix.archive }}"

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
        id: syft

      - name: generate SBOM
        # shell: bash so the line continuations work on Windows
        # (default on windows-latest is pwsh, which doesn't accept `\`).
        shell: bash
        run: |
          # Workspace root owns target/. See note on stage artifact step.
          "${{ steps.syft.outputs.cmd }}" "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            -o spdx-json="omega-${{ matrix.target }}.spdx.json"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-${{ matrix.target }}
          path: |
            omega-${{ matrix.target }}.${{ matrix.archive }}
            omega-${{ matrix.target }}.${{ matrix.archive }}.sha256
            omega-${{ matrix.target }}.${{ matrix.archive }}.sig
            omega-${{ matrix.target }}.${{ matrix.archive }}.cert
            omega-${{ matrix.target }}.spdx.json
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: install git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --verbose --tag ${{ github.ref_name }} --latest --strip all

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: compute SHA256SUMS
        working-directory: artifacts
        # Python is on every GitHub runner (see the per-platform stage step for
        # the rationale on sha256sum portability).
        run: python -c "import hashlib, os; [print(hashlib.sha256(open(f, 'rb').read()).hexdigest() + '  ' + f) for f in sorted(os.listdir('.')) if f.startswith('omega-')]" > SHA256SUMS

      - name: install cosign (publish)
        uses: sigstore/cosign-installer@v3

      - name: sign SHA256SUMS (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.cert \
            SHA256SUMS

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## ${{ github.ref_name }}

            ${{ steps.cliff.outputs.content }}

            ## Verification

            Each artifact is signed with [cosign](https://docs.sigstore.dev/) keyless OIDC.
            Verify with:

            ```sh
            cosign verify-blob \
              --certificate ${{ github.ref_name }}.<target>.<archive>.cert \
              --signature   ${{ github.ref_name }}.<target>.<archive>.sig \
              --certificate-identity-regexp 'https://github.com/.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              ${{ github.ref_name }}.<target>.<archive>
            ```

            Checksums: see `SHA256SUMS` in this release.
          files: |
            artifacts/**
            LICENSE
            README.md
