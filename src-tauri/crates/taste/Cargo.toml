[package]
name = "taste"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
log = "0.4"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
once_cell = "1.8"
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"

# For ML - will evaluate tch-rs vs burn later
# tch-rs = { version = "0.15", optional = true }
# burn = { version = "0.12", optional = true }

# Dependencies on other Omega crates
memory = { path = "../memory", optional = true }

[features]
default = ["local-storage"]
ml = []
local-storage = []
cloud-sync = []
cli-integration = []

[[bin]]
name = "omega-taste"
path = "src/main.rs"
