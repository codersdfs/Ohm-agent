[package]
name = "mcp"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full", "process", "io-std", "io-util"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"

# Mock MCP server binary for integration tests
[[bin]]
name = "mock-mcp-server"
path = "src/bin/mock_mcp_server.rs"
