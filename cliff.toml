# git-cliff configuration for Omega Agent.
# Generates CHANGELOG.md from conventional commits.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [unreleased]
{% endif %}{% for group, commits in commits | filter(attribute="merge", value=false) | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits | sort(attribute="message") %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**BREAKING**) {% endif %}
{% endfor %}
{% for commit in commits | filter(attribute="breaking", value=true) %}
{% endfor %}
{% endfor %}
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# commit_parsers is an array of tables (the [[ ]] form).
# - entry 0: extract scope/message from a conventional commit; detect
#           breaking-change footer in the body.
# - entry 1: group commits by their conventional-commit type.
# - entry 2: route revert: commits into a Reverted group.
[[commit_parsers]]
message = "^(?P<scope>[a-zA-Z0-9_-]+):\\s*(?P<message>.+)$"
body = "BREAKING[ -]CHANGE: (?P<breaking_change>.+)"

[[commit_parsers]]
match = "^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(?:\\([^)]*\\))?!?:\\s*.+"
group = "{{ type }}"

[[commit_parsers]]
message = "^revert:.*"
group = "Reverted"
